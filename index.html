    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Photoroom API Key

            // Indicators

            const posYVal = getEl('posYVal');

            // Frame Controls

            const fgUrlInput = getEl('fgUrlInput');
            const bgFileInput = getEl('bgFileInput');
            const fgFileInput = getEl('fgFileInput');
            const showBgToggle = getEl('showBgToggle');
            const showFgToggle = getEl('showFgToggle');
            const reloadFramesBtn = getEl('reloadFramesBtn');

            // Operations & Download
            const resetTransformBtn = getEl('resetTransformBtn');
            const centerPhotoBtn = getEl('centerPhotoBtn');
            const flipPhotoBtn = getEl('flipPhotoBtn');
            const removeBgBtn = getEl('removeBgBtn');
            const downloadBtn = getEl('downloadBtn');

            // Overlays & Toast
            const loadingOverlay = getEl('loadingOverlay');
            const loadingText = getEl('loadingText');
            const loadingSubtext = getEl('loadingSubtext');
            const toast = getEl('toast');
            const toastMsg = getEl('toastMsg');

            // State
            let userImg = null;
            let rawUserImg = null; // Keeps original reference
            let fgImg = null;
            let bgImg = null;

            let showBgLayer = true;
            let showFgLayer = true;

            let transform = {
                x: 0,
                y: 0,
                scale: 1.0,
                flipH: false
            };

            // Touch / Mouse Drag State
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;

            /**
             * Smart Client-side White Background Removal Algorithm
             * Uses Flood-Fill starting from image borders to convert white/light backdrop into transparent alpha.
             */
            function removeWhiteBackgroundFromImage(imgElement, threshold = 230) {
                return new Promise((resolve) => {
                    try {
                        const tempCanvas = document.createElement('canvas');
                        const w = imgElement.naturalWidth || imgElement.width || 800;
                        const h = imgElement.naturalHeight || imgElement.height || 800;
                        tempCanvas.width = w;
                        tempCanvas.height = h;

                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(imgElement, 0, 0, w, h);

                        const imgData = tempCtx.getImageData(0, 0, w, h);
                        const data = imgData.data;

                        // Visited array for flood fill
                        const visited = new Uint8Array(w * h);
                        const queue = [];

                        // Push border pixels if light
                        function checkAndPushBorder(x, y) {
                            const idx = y * w + x;
                            if (visited[idx]) return;
                            const p = idx * 4;
                            const r = data[p], g = data[p + 1], b = data[p + 2];
                            // Check if pixel is white/off-white
                            if (r >= threshold && g >= threshold && b >= threshold) {
                                visited[idx] = 1;
                                queue.push(idx);
                            }
                        }

                        for (let x = 0; x < w; x++) {
                            checkAndPushBorder(x, 0);
                            checkAndPushBorder(x, h - 1);
                        }
                        for (let y = 0; y < h; y++) {
                            checkAndPushBorder(0, y);
                            checkAndPushBorder(w - 1, y);
                        }

                        let head = 0;
                        while (head < queue.length) {
                            const idx = queue[head++];
                            const px = idx % w;
                            const py = Math.floor(idx / w);
                            const p = idx * 4;

                            // Make background pixel fully transparent
                            data[p + 3] = 0;

                            // 4-Connectivity neighbors
                            const neighbors = [
                                [px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]
                            ];

                            for (let i = 0; i < neighbors.length; i++) {
                                const nx = neighbors[i][0];
                                const ny = neighbors[i][1];
                                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                                    const nIdx = ny * w + nx;
                                    if (!visited[nIdx]) {
                                        const np = nIdx * 4;
                                        const nr = data[np], ng = data[np + 1], nb = data[np + 2];
                                        if (nr >= threshold && ng >= threshold && nb >= threshold) {
                                            visited[nIdx] = 1;
                                            queue.push(nIdx);
                                        }
                                    }
                                }
                            }
                        }

                        tempCtx.putImageData(imgData, 0, 0);

                        const resultImg = new Image();
                        resultImg.onload = () => resolve(resultImg);
                        resultImg.onerror = () => resolve(imgElement);
                        resultImg.src = tempCanvas.toDataURL('image/png');
                    } catch (e) {
                        console.warn('White BG Removal process failed:', e);
                        resolve(imgElement);
                    }
                });
            }

            // Fallback Vector Frame Generators if external GitHub URLs 404
            function createFallbackBackground() {
                const bgCanvas = document.createElement('canvas');
                bgCanvas.width = 2048;
                bgCanvas.height = 2048;
                const bgCtx = bgCanvas.getContext('2d');

                const grad = bgCtx.createRadialGradient(1024, 1024, 200, 1024, 1024, 1400);
                grad.addColorStop(0, '#1c1917');
                grad.addColorStop(0.6, '#0c0a09');
                grad.addColorStop(1, '#020617');
                bgCtx.fillStyle = grad;
                bgCtx.fillRect(0, 0, 2048, 2048);

                bgCtx.strokeStyle = 'rgba(220, 38, 38, 0.15)';
                bgCtx.lineWidth = 12;
                bgCtx.beginPath();
                bgCtx.arc(1024, 1024, 850, 0, Math.PI * 2);
                bgCtx.stroke();

                const img = new Image();
                img.src = bgCanvas.toDataURL();
                return img;
            }

            function createFallbackForeground() {
                const fgCanvas = document.createElement('canvas');
                fgCanvas.width = 2048;
                fgCanvas.height = 2048;
                const fgCtx = fgCanvas.getContext('2d');

                fgCtx.lineWidth = 40;
                fgCtx.strokeStyle = '#dc2626';
                fgCtx.beginPath();
                fgCtx.arc(1024, 1024, 980, 0, Math.PI * 2);
                fgCtx.stroke();

                fgCtx.lineWidth = 20;
                fgCtx.strokeStyle = '#16a34a';
                fgCtx.beginPath();
                fgCtx.arc(1024, 1024, 940, 0, Math.PI * 2);
                fgCtx.stroke();

                fgCtx.fillStyle = 'rgba(15, 15, 18, 0.88)';
                fgCtx.beginPath();
                fgCtx.roundRect(324, 1680, 1400, 260, 40);
                fgCtx.fill();
                fgCtx.lineWidth = 6;
                fgCtx.strokeStyle = '#dc2626';
                fgCtx.stroke();

                fgCtx.fillStyle = '#ffffff';
                fgCtx.font = 'bold 90px "Hind Siliguri", sans-serif';
                fgCtx.textAlign = 'center';
                fgCtx.fillText('প্রত্যাবর্তন ২.০', 1024, 1800);

                fgCtx.fillStyle = '#16a34a';
                fgCtx.font = 'bold 45px "Hind Siliguri", sans-serif';
                fgCtx.fillText('Pro ALBD Official Frame', 1024, 1880);

                const img = new Image();
                img.src = fgCanvas.toDataURL();
                return img;
            }

            // Load Fixed Frame Images safely
            function loadFixedFrames() {
                showLoading('ফ্রেম লোড হচ্ছে...', 'ব্যাকগ্রাউন্ড ও ফোরগ্রাউন্ড লেয়ার প্রস্তুত করা হচ্ছে');

                let bgLoaded = false;
                let fgLoaded = false;

                const checkDone = () => {
                    if (bgLoaded && fgLoaded) {
                        hideLoading();
                        renderCanvas();
                    }
                };

                bgImg = new Image();
                bgImg.crossOrigin = 'anonymous';
                bgImg.onload = () => {
                    bgLoaded = true;
                    checkDone();
                };
                bgImg.onerror = () => {
                    console.warn('Background image failed to load from URL. Using fallback frame.');
                    bgImg = createFallbackBackground();
                    bgLoaded = true;
                    checkDone();
                };
                bgImg.src = backgroundUrl;

                fgImg = new Image();
                fgImg.crossOrigin = 'anonymous';
                fgImg.onload = () => {
                    fgLoaded = true;
                    checkDone();
                };
                fgImg.onerror = () => {
                    console.warn('Foreground image failed to load from URL. Using fallback frame.');
                    fgImg = createFallbackForeground();
                    fgLoaded = true;
                    checkDone();
                };
                fgImg.src = foregroundUrl;
            }

            // Render Canvas Layers
            function renderCanvas() {
                if (!ctx) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 1. Draw Background Layer
                if (showBgLayer) {
                    if (bgImg && bgImg.complete && bgImg.naturalWidth !== 0) {
                        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.fillStyle = '#09090b';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                } else {
                    ctx.fillStyle = '#09090b';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // 2. Draw User Photo Layer
                if (userImg && userImg.complete) {
                    ctx.save();

                    const centerX = canvas.width / 2 + transform.x;
                    const centerY = canvas.height / 2 + transform.y;
                    ctx.translate(centerX, centerY);

                    ctx.scale(transform.flipH ? -1 : 1, 1);

                    const scaledWidth = userImg.width * transform.scale;
                    const scaledHeight = userImg.height * transform.scale;

                    ctx.drawImage(userImg, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);
                    ctx.restore();
                }

                // 3. Draw Foreground Layer (Overlay Frame)
                if (showFgLayer && fgImg && fgImg.complete && fgImg.naturalWidth !== 0) {
                    ctx.drawImage(fgImg, 0, 0, canvas.width, canvas.height);
                }
            }

            // Process photo with Photoroom AI + White background stripper fallback
            async function processPhotoWithPhotoroom(file) {
                if (!file) return;

                showLoading('ছবি আপলোড করা হচ্ছে...', 'ব্যাকগ্রাউন্ড ক্লিয়ার করা হচ্ছে');

                try {
                    const formData = new FormData();
                    formData.append('image_file', file, 'user_photo.png');

                    const response = await fetch('https://sdk.photoroom.com/v1/segment', {
                        method: 'POST',
                        headers: {
                            'x-api-key': PHOTOROOM_API_KEY
                        },
                        body: formData
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const resultBlob = await response.blob();
                    const resultUrl = URL.createObjectURL(resultBlob);

                    const bgRemovedImg = new Image();
                    bgRemovedImg.onload = async () => {
                        rawUserImg = bgRemovedImg;
                        // Extra pass to ensure any remaining border white pixels are stripped
                        userImg = await removeWhiteBackgroundFromImage(bgRemovedImg, 240);
                        
                        const scaleRatio = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                        transform.scale = scaleRatio;
                        transform.x = 0;
                        transform.y = 0;
                        syncSliderValues();
                        hideLoading();
                        renderCanvas();
                        showToast('ব্যাকগ্রাউন্ড সফলভাবে রিমুভ হয়েছে');
                    };
                    bgRemovedImg.src = resultUrl;

                } catch (err) {
                    console.warn('Photoroom API Fallback:', err);
                    
                    // Fallback using original image + intelligent client side white background remover
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const fallbackImg = new Image();
                        fallbackImg.onload = async () => {
                            rawUserImg = fallbackImg;
                            // Remove white background automatically
                            userImg = await removeWhiteBackgroundFromImage(fallbackImg, 230);
                            
                            const scaleRatio = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                            transform.scale = scaleRatio;
                            transform.x = 0;
                            transform.y = 0;
                            syncSliderValues();
                            hideLoading();
                            renderCanvas();
                            showToast('ছবি থেকে সাদা ব্যাকগ্রাউন্ড সরাণো হয়েছে');
                        };
                        fallbackImg.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }

            // Sync Sliders
            function syncSliderValues() {
                if (zoomSlider) zoomSlider.value = Math.round(transform.scale * 100);
                if (posXSlider) posXSlider.value = transform.x;
                if (posYSlider) posYSlider.value = transform.y;

                if (zoomVal) zoomVal.textContent = Math.round(transform.scale * 100) + '%';
                if (posXVal) posXVal.textContent = Math.round(transform.x) + 'px';
                if (posYVal) posYVal.textContent = Math.round(transform.y) + 'px';
            }

            // Sliders Event Listeners
            if (zoomSlider) {
                zoomSlider.addEventListener('input', (e) => {
                    transform.scale = parseFloat(e.target.value) / 100;
                    if (zoomVal) zoomVal.textContent = e.target.value + '%';
                    renderCanvas();
                });
            }

            if (posXSlider) {
                posXSlider.addEventListener('input', (e) => {
                    transform.x = parseInt(e.target.value);
                    if (posXVal) posXVal.textContent = e.target.value + 'px';
                    renderCanvas();
                });
            }

            if (posYSlider) {
                posYSlider.addEventListener('input', (e) => {
                    transform.y = parseInt(e.target.value);
                    if (posYVal) posYVal.textContent = e.target.value + 'px';
                    renderCanvas();
                });
            }

            // Layer Visibility Toggles
            if (showBgToggle) {
                showBgToggle.addEventListener('change', (e) => {
                    showBgLayer = e.target.checked;
                    renderCanvas();
                });
            }

            if (showFgToggle) {
                showFgToggle.addEventListener('change', (e) => {
                    showFgLayer = e.target.checked;
                    renderCanvas();
                });
            }

            // Custom URL / File Listeners
            if (bgUrlInput) {
                bgUrlInput.addEventListener('change', (e) => {
                    if (e.target.value.trim()) {
                        backgroundUrl = e.target.value.trim();
                        loadFixedFrames();
                    }
                });
            }

            if (fgUrlInput) {
                fgUrlInput.addEventListener('change', (e) => {
                    if (e.target.value.trim()) {
                        foregroundUrl = e.target.value.trim();
                        loadFixedFrames();
                    }
                });
            }

            if (bgFileInput) {
                bgFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            backgroundUrl = evt.target.result;
                            loadFixedFrames();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            }

            if (fgFileInput) {
                fgFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            foregroundUrl = evt.target.result;
                            loadFixedFrames();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            }

            if (reloadFramesBtn) {
                reloadFramesBtn.addEventListener('click', () => {
                    loadFixedFrames();
                    showToast('ফ্রেম রি-লোড করা হচ্ছে');
                });
            }

            // File input listeners
            if (userPhotoInput) {
                userPhotoInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        processPhotoWithPhotoroom(e.target.files[0]);
                    }
                });
            }

            // Drag and Drop Zone
            if (dropZone) {
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('border-brandRed', 'bg-zinc-900');
                });

                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('border-brandRed', 'bg-zinc-900');
                });

                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-brandRed', 'bg-zinc-900');
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        processPhotoWithPhotoroom(e.dataTransfer.files[0]);
                    }
                });
            }

            // Quick Operations
            if (resetTransformBtn) {
                resetTransformBtn.addEventListener('click', () => {
                    if (userImg) {
                        transform.scale = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                    } else {
                        transform.scale = 1.0;
                    }
                    transform.x = 0;
                    transform.y = 0;
                    transform.flipH = false;
                    syncSliderValues();
                    renderCanvas();
                    showToast('এডজাস্টমেন্ট রিসেট করা হয়েছে');
                });
            }

            if (centerPhotoBtn) {
                centerPhotoBtn.addEventListener('click', () => {
                    transform.x = 0;
                    transform.y = 0;
                    syncSliderValues();
                    renderCanvas();
                    showToast('ছবি সেন্টারে আনা হয়েছে');
                });
            }

            if (flipPhotoBtn) {
                flipPhotoBtn.addEventListener('click', () => {
                    transform.flipH = !transform.flipH;
                    renderCanvas();
                    showToast('ছবি ফ্লিপ করা হয়েছে');
                });
            }

            if (removeBgBtn) {
                removeBgBtn.addEventListener('click', async () => {
                    if (!userImg) {
                        showToast('প্রথমে একটি ছবি আপলোড করুন');
                        return;
                    }
                    showLoading('সাদা ব্যাকগ্রাউন্ড পরিষ্কার করা হচ্ছে...');
                    const source = rawUserImg || userImg;
                    userImg = await removeWhiteBackgroundFromImage(source, 220);
                    hideLoading();
                    renderCanvas();
                    showToast('সাদা ব্যাকগ্রাউন্ড দূর করা হয়েছে');
                });
            }

            // Touch & Mouse Dragging logic
            function getCanvasCoords(e) {
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            if (canvas) {
                const startDrag = (e) => {
                    isDragging = true;
                    const coords = getCanvasCoords(e);
                    dragStartX = coords.x - transform.x;
                    dragStartY = coords.y - transform.y;
                };

                const moveDrag = (e) => {
                    if (!isDragging) return;
                    const coords = getCanvasCoords(e);
                    transform.x = Math.max(-1000, Math.min(1000, coords.x - dragStartX));
                    transform.y = Math.max(-1000, Math.min(1000, coords.y - dragStartY));
                    syncSliderValues();
                    renderCanvas();
                };

                const stopDrag = () => {
                    isDragging = false;
                };

                canvas.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', moveDrag);
                window.addEventListener('mouseup', stopDrag);

                canvas.addEventListener('touchstart', startDrag, { passive: true });
                window.addEventListener('touchmove', moveDrag, { passive: true });
                window.addEventListener('touchend', stopDrag);
            }

            // Download HD Image
            function downloadDP() {
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = `Protyaborton_DP_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                showToast('এইচডি ডি পি ডাউনলোড শুরু হয়েছে!');
            }

            if (downloadBtn) downloadBtn.addEventListener('click', downloadDP);

            // Helpers
            function showLoading(text, subtext) {
                if (loadingText) loadingText.textContent = text;
                if (loadingSubtext) loadingSubtext.textContent = subtext || '';
                if (loadingOverlay) loadingOverlay.classList.remove('hidden');
            }

            function hideLoading() {
                if (loadingOverlay) loadingOverlay.classList.add('hidden');
            }

            function showToast(message) {
                if (!toast || !toastMsg) return;
                toastMsg.textContent = message;
                toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
                }, 3000);
            }

            // Initial SVG placeholder photo
            function loadSamplePhoto() {
                const sampleSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
                    <rect width="800" height="800" fill="transparent"/>
                    <circle cx="400" cy="300" r="140" fill="#dc2626"/>
                    <path d="M 180 680 C 180 480, 620 480, 620 680 Z" fill="#16a34a"/>
                </svg>`;

                userImg = new Image();
                userImg.onload = () => {
                    if (userImg) {
                        transform.scale = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                    }
                    syncSliderValues();
                    renderCanvas();
                };
            }

            // Initialize Application
            loadSamplePhoto();
            loadFixedFrames();
        });
    </script>
</body>
</html>
