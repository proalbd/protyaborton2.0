<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রত্যাবর্তন ২.০ - ফ্রেম মেকার</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandRed: '#dc2626',
                        brandGreen: '#16a34a',
                        darkBg: '#09090b',
                        cardBg: '#141416',
                        borderBg: '#27272a'
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts Bengali (Hind Siliguri) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }

        /* Minimal Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: #27272a;
            height: 4px;
            border-radius: 999px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #dc2626;
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Custom Minimal Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-zinc-100 selection:bg-brandRed selection:text-white">

    <!-- Minimal Header -->
    <header class="border-b border-borderBg bg-darkBg/90 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-base font-bold text-white tracking-tight">প্রত্যাবর্তন ২.০ ফ্রেম</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Unified Main Layout (No Tabs, Completely Minimal) -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- LEFT COLUMN: Canvas Live Viewport -->
        <div class="lg:col-span-6 flex flex-col items-center gap-4 lg:sticky lg:top-20">
            <div class="w-full bg-cardBg border border-borderBg p-4 rounded-2xl flex flex-col items-center">

                <!-- Canvas Wrapper -->
                <div id="canvasWrapper" class="relative rounded-xl overflow-hidden bg-black border border-borderBg aspect-square w-full max-w-[420px] group">
                    <canvas id="dpCanvas" width="2048" height="2048" class="w-full h-full cursor-grab active:cursor-grabbing block touch-none"></canvas>

                    <!-- Loading State -->
                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/90 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-4 text-center">
                        <i class="fa-solid fa-spinner animate-spin text-2xl text-brandRed mb-2"></i>
                        <h4 id="loadingText" class="text-sm font-semibold text-white">প্রসেসিং হচ্ছে...</h4>
                        <p id="loadingSubtext" class="text-xs text-zinc-400 mt-1">অনুগ্রহ করে অপেক্ষা করুন</p>
                    </div>
                </div>

                <!-- Quick Canvas Operations -->
                <div class="grid grid-cols-3 gap-2 mt-4 w-full max-w-[420px]">
                    <button id="centerPhotoBtn" class="py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 font-medium transition active:scale-95">
                        <i class="fa-solid fa-crosshairs mr-1"></i> সেন্টারে আনুন
                    </button>
                    <button id="flipPhotoBtn" class="py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 font-medium transition active:scale-95">
                        <i class="fa-solid fa-right-left mr-1"></i> ফ্লিপ (Flip)
                    </button>
                    <button id="resetTransformBtn" class="py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 font-medium transition active:scale-95">
                        <i class="fa-solid fa-rotate-left mr-1"></i> রিসেট
                    </button>
                </div>
            </div>

            <!-- Primary Download Button -->
            <button id="downloadBtn" class="w-full max-w-[420px] py-3 rounded-xl bg-brandRed hover:bg-red-700 text-white font-bold text-sm shadow-md transition active:scale-[0.99] flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-down"></i>
                <span>এইচডি ডি পি ডাউনলোড করুন</span>
            </button>
        </div>

        <!-- RIGHT COLUMN: Single Unified Control Panel -->
        <div class="lg:col-span-6 flex flex-col gap-5">

            <!-- 1. Upload & AI Background Removal Section -->
            <div class="bg-cardBg border border-borderBg p-5 rounded-2xl flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span class="w-5 h-5 rounded bg-brandRed/20 text-brandRed text-xs flex items-center justify-center font-bold">১</span>
                        ছবি আপলোড
                    </h3>
                </div>

                <label id="dropZone" class="flex flex-col items-center justify-center border border-dashed border-zinc-700 hover:border-brandRed bg-zinc-950/50 hover:bg-zinc-900/80 rounded-xl p-5 cursor-pointer transition group">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-zinc-400 group-hover:text-brandRed mb-2 transition"></i>
                    <span class="text-xs font-semibold text-zinc-200">এখানে ছবি ড্রপ করুন অথবা ফাইল সিলেক্ট করুন</span>
                    <span class="text-[10px] text-zinc-500 mt-0.5">JPG, PNG বা WEBP সমর্থিত</span>
                    <input type="file" id="userPhotoInput" accept="image/*" class="hidden">
                </label>
            </div>

            <!-- 2. Image Adjustments -->
            <div class="bg-cardBg border border-borderBg p-5 rounded-2xl flex flex-col gap-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <span class="w-5 h-5 rounded bg-brandRed/20 text-brandRed text-xs flex items-center justify-center font-bold">২</span>
                    ছবি এডজাস্টমেন্ট
                </h3>

                <!-- Zoom Slider -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium">জুম (Scale)</span>
                        <span id="zoomVal" class="text-zinc-400 font-mono text-[11px]">100%</span>
                    </div>
                    <input type="range" id="zoomSlider" min="10" max="300" value="100">
                </div>

                <!-- Position X -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium">ডানে / বামে (X Position)</span>
                        <span id="posXVal" class="text-zinc-400 font-mono text-[11px]">0px</span>
                    </div>
                    <input type="range" id="posXSlider" min="-500" max="500" value="0">
                </div>

                <!-- Position Y -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium">উপরে / নিচে (Y Position)</span>
                        <span id="posYVal" class="text-zinc-400 font-mono text-[11px]">0px</span>
                    </div>
                    <input type="range" id="posYSlider" min="-500" max="500" value="0">
                </div>

            </div>

        </div>
    </main>

    <!-- Minimal Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-zinc-900 border border-borderBg text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-info text-brandRed"></i>
        <span id="toastMsg">নোটিফিকেশন</span>
    </div>

    <!-- Minimal Footer -->
    <footer class="py-4 text-center text-xs text-zinc-500 border-t border-borderBg mt-8 bg-darkBg">
        <p>© Pro ALBD Team</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Photoroom API Key
            const PHOTOROOM_API_KEY = 'sk_pr_default_14ddbad48fd3059de0b3bd10a48b0eb457fd680c';

            // =========================================================================
            // 🖼️ প্লেসহোল্ডার ফ্রেম ইমেজের URL (পরে এখানে আপনার নিজের ইমেজের লিংক বসিয়ে নিবেন)
            // =========================================================================
            const BACKGROUND_IMAGE_URL = './p-bg.jpg';
            const FOREGROUND_IMAGE_URL = './p-fg.png';

            // Canvas Elements
            const canvas = document.getElementById('dpCanvas');
            const ctx = canvas.getContext('2d');

            // Controls & Sliders
            const userPhotoInput = document.getElementById('userPhotoInput');
            const dropZone = document.getElementById('dropZone');

            const zoomSlider = document.getElementById('zoomSlider');
            const posXSlider = document.getElementById('posXSlider');
            const posYSlider = document.getElementById('posYSlider');
            const rotateSlider = document.getElementById('rotateSlider');
            const brightSlider = document.getElementById('brightSlider');
            const contrastSlider = document.getElementById('contrastSlider');

            // Slider Indicators
            const zoomVal = document.getElementById('zoomVal');
            const posXVal = document.getElementById('posXVal');
            const posYVal = document.getElementById('posYVal');
            const rotateVal = document.getElementById('rotateVal');
            const brightVal = document.getElementById('brightVal');
            const contrastVal = document.getElementById('contrastVal');

            // Action Buttons
            const resetTransformBtn = document.getElementById('resetTransformBtn');
            const centerPhotoBtn = document.getElementById('centerPhotoBtn');
            const flipPhotoBtn = document.getElementById('flipPhotoBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const topDownloadBtn = document.getElementById('topDownloadBtn');

            // Overlay & Toast
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const loadingSubtext = document.getElementById('loadingSubtext');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            // Image Layers & Transform State
            let userImg = null;
            let fgImg = null;
            let bgImg = null;

            let transform = {
                x: 0,
                y: 0,
                scale: 1.0,
                rotate: 0,
                flipH: false,
                brightness: 100,
                contrast: 100
            };

            // Touch Drag State
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;

            // Load Fixed Frame Images
            function loadFixedFrames() {
                showLoading('ফ্রেম লোড হচ্ছে...', 'ব্যাকগ্রাউন্ড ও ফোরগ্রাউন্ড লেয়ার প্রস্তুত হচ্ছে');

                let loaded = 0;
                const checkDone = () => {
                    loaded++;
                    if (loaded === 2) {
                        hideLoading();
                        renderCanvas();
                    }
                };

                bgImg = new Image();
                bgImg.crossOrigin = 'anonymous';
                bgImg.onload = checkDone;
                bgImg.onerror = () => { console.warn('Background image failed to load'); checkDone(); };
                bgImg.src = BACKGROUND_IMAGE_URL;

                fgImg = new Image();
                fgImg.crossOrigin = 'anonymous';
                fgImg.onload = checkDone;
                fgImg.onerror = () => { console.warn('Foreground image failed to load'); checkDone(); };
                fgImg.src = FOREGROUND_IMAGE_URL;
            }

            function renderCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 1. Draw Background Layer
                if (bgImg && bgImg.complete) {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#09090b';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // 2. Draw User Photo Layer
                if (userImg && userImg.complete) {
                    ctx.save();
                    ctx.filter = `brightness(${transform.brightness}%) contrast(${transform.contrast}%)`;

                    const centerX = canvas.width / 2 + transform.x;
                    const centerY = canvas.height / 2 + transform.y;
                    ctx.translate(centerX, centerY);

                    ctx.rotate((transform.rotate * Math.PI) / 180);
                    ctx.scale(transform.flipH ? -1 : 1, 1);

                    const scaledWidth = userImg.width * transform.scale;
                    const scaledHeight = userImg.height * transform.scale;

                    ctx.drawImage(userImg, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);
                    ctx.restore();
                }

                // 3. Draw Foreground Layer
                if (fgImg && fgImg.complete) {
                    ctx.drawImage(fgImg, 0, 0, canvas.width, canvas.height);
                }
            }

            async function processPhotoWithPhotoroom(file) {
                if (!file) return;

                showLoading('ছবির ব্যাকগ্রাউন্ড রিমুভ করা হচ্ছে');

                try {
                    const formData = new FormData();
                    formData.append('image_file', file, 'user_photo.png');

                    const response = await fetch('https://sdk.photoroom.com/v1/segment', {
                        method: 'POST',
                        headers: {
                            'x-api-key': PHOTOROOM_API_KEY
                        },
                        body: formData
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const resultBlob = await response.blob();
                    const resultUrl = URL.createObjectURL(resultBlob);

                    const bgRemovedImg = new Image();
                    bgRemovedImg.onload = () => {
                        userImg = bgRemovedImg;
                        const scaleRatio = Math.min(canvas.width / bgRemovedImg.width, canvas.height / bgRemovedImg.height) * 0.85;
                        transform.scale = scaleRatio;
                        transform.x = 0;
                        transform.y = 0;
                        syncSliderValues();
                        hideLoading();
                        renderCanvas();
                        showToast('ব্যাকগ্রাউন্ড সফলভাবে রিমুভ হয়েছে');
                    };
                    bgRemovedImg.src = resultUrl;

                } catch (err) {
                    console.warn('Photoroom API Fallback:', err);
                    
                    // Fallback using original image
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const fallbackImg = new Image();
                        fallbackImg.onload = () => {
                            userImg = fallbackImg;
                            const scaleRatio = Math.min(canvas.width / fallbackImg.width, canvas.height / fallbackImg.height) * 0.85;
                            transform.scale = scaleRatio;
                            transform.x = 0;
                            transform.y = 0;
                            syncSliderValues();
                            hideLoading();
                            renderCanvas();
                            showToast('মূল ছবি সিলেক্ট করা হয়েছে');
                        };
                        fallbackImg.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }

            // File input listeners
            userPhotoInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    processPhotoWithPhotoroom(e.target.files[0]);
                }
            });

            // Drag and Drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-brandRed');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-brandRed');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-brandRed');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    processPhotoWithPhotoroom(e.dataTransfer.files[0]);
                }
            });

            // Sync Sliders Logic
            function syncSliderValues() {
                zoomSlider.value = Math.round(transform.scale * 100);
                posXSlider.value = transform.x;
                posYSlider.value = transform.y;
                rotateSlider.value = transform.rotate;
                brightSlider.value = transform.brightness;
                contrastSlider.value = transform.contrast;

                zoomVal.textContent = Math.round(transform.scale * 100) + '%';
                posXVal.textContent = transform.x + 'px';
                posYVal.textContent = transform.y + 'px';
                rotateVal.textContent = transform.rotate + '°';
                brightVal.textContent = transform.brightness + '%';
                contrastVal.textContent = transform.contrast + '%';
            }

            zoomSlider.addEventListener('input', (e) => {
                transform.scale = parseFloat(e.target.value) / 100;
                zoomVal.textContent = e.target.value + '%';
                renderCanvas();
            });

            posXSlider.addEventListener('input', (e) => {
                transform.x = parseInt(e.target.value);
                posXVal.textContent = e.target.value + 'px';
                renderCanvas();
            });

            posYSlider.addEventListener('input', (e) => {
                transform.y = parseInt(e.target.value);
                posYVal.textContent = e.target.value + 'px';
                renderCanvas();
            });

            rotateSlider.addEventListener('input', (e) => {
                transform.rotate = parseInt(e.target.value);
                rotateVal.textContent = e.target.value + '°';
                renderCanvas();
            });

            brightSlider.addEventListener('input', (e) => {
                transform.brightness = parseInt(e.target.value);
                brightVal.textContent = e.target.value + '%';
                renderCanvas();
            });

            contrastSlider.addEventListener('input', (e) => {
                transform.contrast = parseInt(e.target.value);
                contrastVal.textContent = e.target.value + '%';
                renderCanvas();
            });

            // Quick Canvas Actions
            resetTransformBtn.addEventListener('click', () => {
                if (userImg) {
                    transform.scale = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                } else {
                    transform.scale = 1.0;
                }
                transform.x = 0;
                transform.y = 0;
                transform.rotate = 0;
                transform.flipH = false;
                transform.brightness = 100;
                transform.contrast = 100;
                syncSliderValues();
                renderCanvas();
                showToast('এডজাস্টমেন্ট রিসেট করা হয়েছে');
            });

            centerPhotoBtn.addEventListener('click', () => {
                transform.x = 0;
                transform.y = 0;
                syncSliderValues();
                renderCanvas();
            });

            flipPhotoBtn.addEventListener('click', () => {
                transform.flipH = !transform.flipH;
                renderCanvas();
            });

            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                const coords = getCanvasCoords(e);
                dragStartX = coords.x - transform.x;
                dragStartY = coords.y - transform.y;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const coords = getCanvasCoords(e);
                transform.x = Math.max(-800, Math.min(800, coords.x - dragStartX));
                transform.y = Math.max(-800, Math.min(800, coords.y - dragStartY));
                syncSliderValues();
                renderCanvas();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            function downloadDP() {
                const link = document.createElement('a');
                link.download = `Protyaborton_DP_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                showToast('এইচডি ডি পি ডাউনলোড হচ্ছে!');
            }

            downloadBtn.addEventListener('click', downloadDP);
            topDownloadBtn.addEventListener('click', downloadDP);

            // Helpers
            function showLoading(text, subtext) {
                loadingText.textContent = text;
                loadingSubtext.textContent = subtext;
                loadingOverlay.classList.remove('hidden');
            }

            function hideLoading() {
                loadingOverlay.classList.add('hidden');
            }

            function showToast(message) {
                toastMsg.textContent = message;
                toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
                }, 3000);
            }

            // Load initial placeholder user photo
            function loadSamplePhoto() {
                const sampleSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
                    <rect width="600" height="600" fill="#141416"/>
                    <circle cx="300" cy="230" r="100" fill="#dc2626"/>
                    <path d="M 140 500 C 140 370, 460 370, 460 500 Z" fill="#16a34a"/>
                </svg>`;

                userImg = new Image();
                userImg.onload = () => renderCanvas();
                userImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sampleSvg);
            }

            // Initialize App
            loadSamplePhoto();
            loadFixedFrames();
        });
    </script>
</body>
</html>
