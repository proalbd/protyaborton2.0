<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রত্যাবর্তন ২.০ - ফ্রেম মেকার</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandRed: '#dc2626',
                        brandGreen: '#16a34a',
                        darkBg: '#09090b',
                        cardBg: '#141416',
                        borderBg: '#27272a'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: #27272a;
            height: 5px;
            border-radius: 999px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #dc2626;
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-zinc-100 selection:bg-brandRed selection:text-white">

    <header class="border-b border-borderBg bg-darkBg/90 sticky top-0 z-50 px-4 py-3 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-base font-bold text-white tracking-tight">প্রত্যাবর্তন ২.০ ফ্রেম</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <div class="lg:col-span-6 flex flex-col items-center gap-4 lg:sticky lg:top-20">
            <div class="w-full bg-cardBg border border-borderBg p-4 rounded-2xl flex flex-col items-center shadow-xl">

                <div id="canvasWrapper" class="relative rounded-xl overflow-hidden bg-black border border-borderBg aspect-square w-full max-w-[420px] group shadow-inner">
                    <canvas id="dpCanvas" width="2048" height="2048" class="w-full h-full cursor-grab active:cursor-grabbing block touch-none"></canvas>

                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/85 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-4 text-center transition-all duration-300">
                        <i class="fa-solid fa-spinner animate-spin text-3xl text-brandRed mb-3"></i>
                        <h4 id="loadingText" class="text-sm font-bold text-white">প্রসেসিং হচ্ছে...</h4>
                        <p id="loadingSubtext" class="text-xs text-zinc-400 mt-1">অনুগ্রহ করে অপেক্ষা করুন</p>
                    </div>
                </div>

                <div id="frameStatusText" class="text-[11px] text-zinc-400 mt-2 text-center flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>ক্যানভাস রেডি (2048 × 2048 HD)</span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4 w-full max-w-[420px]">
                    <button id="centerPhotoBtn" class="py-2.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 border border-borderBg text-xs text-zinc-200 font-medium transition active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-crosshairs text-brandRed"></i> সেন্টার
                    </button>
                    <button id="flipPhotoBtn" class="py-2.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 border border-borderBg text-xs text-zinc-200 font-medium transition active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-right-left text-brandRed"></i> ফ্লিপ
                    </button>
                    <button id="resetTransformBtn" class="py-2.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 border border-borderBg text-xs text-zinc-200 font-medium transition active:scale-95 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-rotate-left text-brandRed"></i> রিসেট
                    </button>
                </div>
            </div>

            <button id="downloadBtn" class="w-full max-w-[420px] py-3.5 rounded-xl bg-gradient-to-r from-red-600 to-brandRed hover:from-red-500 hover:to-red-600 text-white font-bold text-sm shadow-lg shadow-red-900/30 transition active:scale-[0.98] flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-down text-base"></i>
                <span>এইচডি ছবি ডাউনলোড করুন</span>
            </button>
        </div>

        <div class="lg:col-span-6 flex flex-col gap-5">

            <div class="bg-cardBg border border-borderBg p-5 rounded-2xl flex flex-col gap-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-brandRed/20 text-brandRed text-xs flex items-center justify-center font-bold">১</span>
                        আপনার ছবি আপলোড করুন
                    </h3>
                </div>

                <label id="dropZone" class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-700 hover:border-brandRed bg-zinc-950/60 hover:bg-zinc-900/80 rounded-xl p-6 cursor-pointer transition-all duration-200 group text-center">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-zinc-400 group-hover:text-brandRed mb-2 transition transform group-hover:-translate-y-1"></i>
                    <span class="text-xs font-semibold text-zinc-200">এখানে ছবি ড্রপ করুন অথবা ডিভাইস থেকে বেছে নিন</span>
                    <span class="text-[11px] text-zinc-500 mt-1">যেকোনো ফরম্যাটের ইমেজ ফাইল আপলোড করুন</span>
                    <input type="file" id="userPhotoInput" accept="image/*" class="hidden">
                </label>
            </div>

            <div class="bg-cardBg border border-borderBg p-5 rounded-2xl flex flex-col gap-4 shadow-lg">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-brandRed/20 text-brandRed text-xs flex items-center justify-center font-bold">৩</span>
                    ছবি পজিশন ও জুম এডজাস্টমেন্ট
                </h3>

                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass-plus text-zinc-400"></i> জুম (Scale)
                        </span>
                        <span id="zoomVal" class="text-brandRed font-mono font-semibold text-xs">100%</span>
                    </div>
                    <input type="range" id="zoomSlider" min="10" max="300" value="100">
                </div>

                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-arrows-left-right text-zinc-400"></i> ডানে / বামে (Position X)
                        </span>
                        <span id="posXVal" class="text-brandRed font-mono font-semibold text-xs">0px</span>
                    </div>
                    <input type="range" id="posXSlider" min="-800" max="800" value="0">
                </div>

                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-zinc-300 font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-arrows-up-down text-zinc-400"></i> উপরে / নিচে (Position Y)
                        </span>
                        <span id="posYVal" class="text-brandRed font-mono font-semibold text-xs">0px</span>
                    </div>
                    <input type="range" id="posYSlider" min="-800" max="800" value="0">
                </div>

            </div>

        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-zinc-900 border border-borderBg text-white text-xs px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-12 opacity-0 pointer-events-none flex items-center gap-2.5">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
        <span id="toastMsg" class="font-medium">নোটিফিকেশন</span>
    </div>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-zinc-500 border-t border-borderBg mt-8 bg-darkBg">
        <p>© Pro ALBD Team</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let backgroundUrl = 'https://raw.githubusercontent.com/proalbd/protyaborton2.0/main/p-bg.jpg';
            let foregroundUrl = 'https://raw.githubusercontent.com/proalbd/protyaborton2.0/main/p-fg.png';

            const getEl = (id) => document.getElementById(id);

            const canvas = getEl('dpCanvas');
            const ctx = canvas ? canvas.getContext('2d') : null;

            const userPhotoInput = getEl('userPhotoInput');
            const dropZone = getEl('dropZone');

            const zoomSlider = getEl('zoomSlider');
            const posXSlider = getEl('posXSlider');
            const posYSlider = getEl('posYSlider');

            const zoomVal = getEl('zoomVal');
            const posXVal = getEl('posXVal');
            const posYVal = getEl('posYVal');

            const bgUrlInput = getEl('bgUrlInput');
            const fgUrlInput = getEl('fgUrlInput');
            const bgFileInput = getEl('bgFileInput');
            const fgFileInput = getEl('fgFileInput');
            const showBgToggle = getEl('showBgToggle');
            const showFgToggle = getEl('showFgToggle');
            const reloadFramesBtn = getEl('reloadFramesBtn');

            const resetTransformBtn = getEl('resetTransformBtn');
            const centerPhotoBtn = getEl('centerPhotoBtn');
            const flipPhotoBtn = getEl('flipPhotoBtn');
            const downloadBtn = getEl('downloadBtn');

            const loadingOverlay = getEl('loadingOverlay');
            const loadingText = getEl('loadingText');
            const loadingSubtext = getEl('loadingSubtext');
            const toast = getEl('toast');
            const toastMsg = getEl('toastMsg');

            let userImg = null;
            let rawUserImg = null;
            let fgImg = null;
            let bgImg = null;

            let showBgLayer = true;
            let showFgLayer = true;

            let transform = {
                x: 0,
                y: 0,
                scale: 1.0,
                flipH: false
            };

            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;

            function processPhoto(file) {
                if (!file) return;

                showLoading('ছবি আপলোড করা হচ্ছে...');

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        rawUserImg = img;
                        userImg = img;

                        const scaleRatio = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                        transform.scale = scaleRatio;
                        transform.x = 0;
                        transform.y = 0;
                        syncSliderValues();
                        hideLoading();
                        renderCanvas();
                        showToast('ছবি আপলোড করা হয়েছে');
                    };
                    img.onerror = () => {
                        hideLoading();
                        showToast('ছবি প্রসেস করতে সমস্যা হয়েছে');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function createFallbackBackground() {
                const bgCanvas = document.createElement('canvas');
                bgCanvas.width = 2048;
                bgCanvas.height = 2048;
                const bgCtx = bgCanvas.getContext('2d');

                const grad = bgCtx.createRadialGradient(1024, 1024, 200, 1024, 1024, 1400);
                grad.addColorStop(0, '#1c1917');
                grad.addColorStop(0.6, '#0c0a09');
                grad.addColorStop(1, '#020617');
                bgCtx.fillStyle = grad;
                bgCtx.fillRect(0, 0, 2048, 2048);

                bgCtx.strokeStyle = 'rgba(220, 38, 38, 0.15)';
                bgCtx.lineWidth = 12;
                bgCtx.beginPath();
                bgCtx.arc(1024, 1024, 850, 0, Math.PI * 2);
                bgCtx.stroke();

                const img = new Image();
                img.src = bgCanvas.toDataURL();
                return img;
            }

            function createFallbackForeground() {
                const fgCanvas = document.createElement('canvas');
                fgCanvas.width = 2048;
                fgCanvas.height = 2048;
                const fgCtx = fgCanvas.getContext('2d');

                fgCtx.lineWidth = 40;
                fgCtx.strokeStyle = '#dc2626';
                fgCtx.beginPath();
                fgCtx.arc(1024, 1024, 980, 0, Math.PI * 2);
                fgCtx.stroke();

                fgCtx.lineWidth = 20;
                fgCtx.strokeStyle = '#16a34a';
                fgCtx.beginPath();
                fgCtx.arc(1024, 1024, 940, 0, Math.PI * 2);
                fgCtx.stroke();

                fgCtx.fillStyle = 'rgba(15, 15, 18, 0.88)';
                fgCtx.beginPath();
                fgCtx.roundRect(324, 1680, 1400, 260, 40);
                fgCtx.fill();
                fgCtx.lineWidth = 6;
                fgCtx.strokeStyle = '#dc2626';
                fgCtx.stroke();

                fgCtx.fillStyle = '#ffffff';
                fgCtx.font = 'bold 90px "Hind Siliguri", sans-serif';
                fgCtx.textAlign = 'center';
                fgCtx.fillText('প্রত্যাবর্তন ২.০', 1024, 1800);

                fgCtx.fillStyle = '#16a34a';
                fgCtx.font = 'bold 45px "Hind Siliguri", sans-serif';
                fgCtx.fillText('Pro ALBD Official Frame', 1024, 1880);

                const img = new Image();
                img.src = fgCanvas.toDataURL();
                return img;
            }

            function loadFixedFrames() {
                showLoading('ফ্রেম লোড হচ্ছে...', 'ব্যাকগ্রাউন্ড ও ফোরগ্রাউন্ড লেয়ার প্রস্তুত করা হচ্ছে');

                let bgLoaded = false;
                let fgLoaded = false;

                const checkDone = () => {
                    if (bgLoaded && fgLoaded) {
                        hideLoading();
                        renderCanvas();
                    }
                };

                bgImg = new Image();
                bgImg.crossOrigin = 'anonymous';
                bgImg.onload = () => {
                    bgLoaded = true;
                    checkDone();
                };
                bgImg.onerror = () => {
                    console.warn('Background image failed to load from URL. Using fallback frame.');
                    bgImg = createFallbackBackground();
                    bgLoaded = true;
                    checkDone();
                };
                bgImg.src = backgroundUrl;

                fgImg = new Image();
                fgImg.crossOrigin = 'anonymous';
                fgImg.onload = () => {
                    fgLoaded = true;
                    checkDone();
                };
                fgImg.onerror = () => {
                    console.warn('Foreground image failed to load from URL. Using fallback frame.');
                    fgImg = createFallbackForeground();
                    fgLoaded = true;
                    checkDone();
                };
                fgImg.src = foregroundUrl;
            }

            function renderCanvas() {
                if (!ctx) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (showBgLayer) {
                    if (bgImg && bgImg.complete && bgImg.naturalWidth !== 0) {
                        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.fillStyle = '#09090b';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                } else {
                    ctx.fillStyle = '#09090b';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                if (userImg && userImg.complete) {
                    ctx.save();

                    const centerX = canvas.width / 2 + transform.x;
                    const centerY = canvas.height / 2 + transform.y;
                    ctx.translate(centerX, centerY);

                    ctx.scale(transform.flipH ? -1 : 1, 1);

                    const scaledWidth = userImg.width * transform.scale;
                    const scaledHeight = userImg.height * transform.scale;

                    ctx.drawImage(userImg, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);
                    ctx.restore();
                }

                if (showFgLayer && fgImg && fgImg.complete && fgImg.naturalWidth !== 0) {
                    ctx.drawImage(fgImg, 0, 0, canvas.width, canvas.height);
                }
            }

            async function processPhotoWithPhotoroom(file) {
                if (!file) return;

                showLoading('ছবি আপলোড করা হচ্ছে...', 'ব্যাকগ্রাউন্ড অপসারণ করা হচ্ছে');

                try {
                    const result = await removeAnyBackground(file, (key, current, total) => {
                        if (total) {
                            const pct = Math.round((current / total) * 100);
                            showLoading('ব্যাকগ্রাউন্ড প্রসেসিং হচ্ছে...', `${pct}% সম্পন্ন`);
                        }
                    });

                    rawUserImg = result.rawImg;
                    userImg = result.img;

                    const scaleRatio = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                    transform.scale = scaleRatio;
                    transform.x = 0;
                    transform.y = 0;
                    syncSliderValues();
                    hideLoading();
                    renderCanvas();
                    showToast('ছবি থেকে ব্যাকগ্রাউন্ড রিমুভ করা হয়েছে');
                } catch (err) {
                    console.error('Error processing photo:', err);
                    hideLoading();
                    showToast('ছবি প্রসেস করতে সমস্যা হয়েছে');
                }
            }

            function syncSliderValues() {
                if (zoomSlider) zoomSlider.value = Math.round(transform.scale * 100);
                if (posXSlider) posXSlider.value = transform.x;
                if (posYSlider) posYSlider.value = transform.y;

                if (zoomVal) zoomVal.textContent = Math.round(transform.scale * 100) + '%';
                if (posXVal) posXVal.textContent = Math.round(transform.x) + 'px';
                if (posYVal) posYVal.textContent = Math.round(transform.y) + 'px';
            }

            if (zoomSlider) {
                zoomSlider.addEventListener('input', (e) => {
                    transform.scale = parseFloat(e.target.value) / 100;
                    if (zoomVal) zoomVal.textContent = e.target.value + '%';
                    renderCanvas();
                });
            }

            if (posXSlider) {
                posXSlider.addEventListener('input', (e) => {
                    transform.x = parseInt(e.target.value);
                    if (posXVal) posXVal.textContent = e.target.value + 'px';
                    renderCanvas();
                });
            }

            if (posYSlider) {
                posYSlider.addEventListener('input', (e) => {
                    transform.y = parseInt(e.target.value);
                    if (posYVal) posYVal.textContent = e.target.value + 'px';
                    renderCanvas();
                });
            }

            if (showBgToggle) {
                showBgToggle.addEventListener('change', (e) => {
                    showBgLayer = e.target.checked;
                    renderCanvas();
                });
            }

            if (showFgToggle) {
                showFgToggle.addEventListener('change', (e) => {
                    showFgLayer = e.target.checked;
                    renderCanvas();
                });
            }

            if (bgUrlInput) {
                bgUrlInput.addEventListener('change', (e) => {
                    if (e.target.value.trim()) {
                        backgroundUrl = e.target.value.trim();
                        loadFixedFrames();
                    }
                });
            }

            if (fgUrlInput) {
                fgUrlInput.addEventListener('change', (e) => {
                    if (e.target.value.trim()) {
                        foregroundUrl = e.target.value.trim();
                        loadFixedFrames();
                    }
                });
            }

            if (bgFileInput) {
                bgFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            backgroundUrl = evt.target.result;
                            loadFixedFrames();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            }

            if (fgFileInput) {
                fgFileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            foregroundUrl = evt.target.result;
                            loadFixedFrames();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            }

            if (reloadFramesBtn) {
                reloadFramesBtn.addEventListener('click', () => {
                    loadFixedFrames();
                    showToast('ফ্রেম রি-লোড করা হচ্ছে');
                });
            }

            if (userPhotoInput) {
                userPhotoInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        processPhoto(e.target.files[0]);
                    }
                });
            }

            if (dropZone) {
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropZone.classList.add('border-brandRed', 'bg-zinc-900');
                });

                dropZone.addEventListener('dragleave', () => {
                    dropZone.classList.remove('border-brandRed', 'bg-zinc-900');
                });

                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-brandRed', 'bg-zinc-900');
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        processPhoto(e.dataTransfer.files[0]);
                    }
                });
            }

            // Quick Operations
            if (resetTransformBtn) {
                resetTransformBtn.addEventListener('click', () => {
                    if (userImg) {
                        transform.scale = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                    } else {
                        transform.scale = 1.0;
                    }
                    transform.x = 0;
                    transform.y = 0;
                    transform.flipH = false;
                    syncSliderValues();
                    renderCanvas();
                    showToast('এডজাস্টমেন্ট রিসেট করা হয়েছে');
                });
            }

            if (centerPhotoBtn) {
                centerPhotoBtn.addEventListener('click', () => {
                    transform.x = 0;
                    transform.y = 0;
                    syncSliderValues();
                    renderCanvas();
                    showToast('ছবি সেন্টারে আনা হয়েছে');
                });
            }

            if (flipPhotoBtn) {
                flipPhotoBtn.addEventListener('click', () => {
                    transform.flipH = !transform.flipH;
                    renderCanvas();
                    showToast('ছবি ফ্লিপ করা হয়েছে');
                });
            }

            function getCanvasCoords(e) {
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            if (canvas) {
                const startDrag = (e) => {
                    isDragging = true;
                    const coords = getCanvasCoords(e);
                    dragStartX = coords.x - transform.x;
                    dragStartY = coords.y - transform.y;
                };

                const moveDrag = (e) => {
                    if (!isDragging) return;
                    const coords = getCanvasCoords(e);
                    transform.x = Math.max(-1000, Math.min(1000, coords.x - dragStartX));
                    transform.y = Math.max(-1000, Math.min(1000, coords.y - dragStartY));
                    syncSliderValues();
                    renderCanvas();
                };

                const stopDrag = () => {
                    isDragging = false;
                };

                canvas.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', moveDrag);
                window.addEventListener('mouseup', stopDrag);

                canvas.addEventListener('touchstart', startDrag, { passive: true });
                window.addEventListener('touchmove', moveDrag, { passive: true });
                window.addEventListener('touchend', stopDrag);
            }

            // Download HD Image
            function downloadDP() {
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = `Protyaborton_DP_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                showToast('এইচডি ডি পি ডাউনলোড শুরু হয়েছে!');
            }

            if (downloadBtn) downloadBtn.addEventListener('click', downloadDP);

            // Helpers
            function showLoading(text, subtext) {
                if (loadingText) loadingText.textContent = text;
                if (loadingSubtext) loadingSubtext.textContent = subtext || '';
                if (loadingOverlay) loadingOverlay.classList.remove('hidden');
            }

            function hideLoading() {
                if (loadingOverlay) loadingOverlay.classList.add('hidden');
            }

            function showToast(message) {
                if (!toast || !toastMsg) return;
                toastMsg.textContent = message;
                toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
                }, 3000);
            }

            // Initial SVG placeholder photo
            function loadSamplePhoto() {
                const sampleSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
                    <rect width="800" height="800" fill="transparent"/>
                    <circle cx="400" cy="300" r="140" fill="#dc2626"/>
                    <path d="M 180 680 C 180 480, 620 480, 620 680 Z" fill="#16a34a"/>
                </svg>`;

                userImg = new Image();
                userImg.onload = () => {
                    if (userImg) {
                        transform.scale = Math.min(canvas.width / userImg.width, canvas.height / userImg.height) * 0.85;
                    }
                    syncSliderValues();
                    renderCanvas();
                };
            }

            // Initialize Application
            loadSamplePhoto();
            loadFixedFrames();
        });
    </script>
</body>
</html>
